site_name: runqy docs
# Published under runqy.com/docs/ by the runqy.com build; docs.runqy.com only redirects there
site_url: https://runqy.com/docs/
site_description: Documentation for runqy, a self-hosted task queue for Python and GPU workloads.
site_author: Publikey

# Internal maintainer docs that must not be published or listed in the sitemap
exclude_docs: |
  FUNCTIONAL_TESTS.md

repo_name: Publikey/runqy
repo_url: https://github.com/Publikey/runqy
edit_uri: https://github.com/Publikey/docs.runqy.com/edit/main/docs/

theme:
  name: material
  # Templates in overrides/: head additions (main.html) and the inline logo (partials/logo.html)
  custom_dir: overrides
  # Geist is self-hosted (docs/stylesheets/fonts.css): nothing is loaded from Google Fonts
  font: false
  favicon: assets/favicon.svg
  # The runqy dashboard's design system (docs/stylesheets/tokens.css). Dark first.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit

extra_css:
  - stylesheets/fonts.css
  - stylesheets/tokens.css
  - stylesheets/theme.css
  - stylesheets/home.css

extra_javascript:
  - javascripts/anchor-redirects.js

# A broken link, anchor or nav entry fails the build (CI runs `mkdocs build --strict`).
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search
  # llms.txt and llms-full.txt, with sections taken from the nav below.
  # runqy.com copies both files to its root: its deploy fails if they are missing.
  - llmstxt-md:
      # Each page is also published as Markdown (<page>/index.md); the plugin's floating
      # "Copy Markdown" button is off because its colours cannot follow the theme.
      enable_copy_button: false
  # Pages moved in the November 2026 reorganisation. Never reuse the old paths.
  - redirects:
      redirect_maps:
        getting-started/index.md: concepts/architecture.md
        getting-started/architecture.md: concepts/architecture.md
        server/index.md: concepts/architecture.md
        server/configuration.md: reference/server-config.md
        server/cli.md: reference/cli.md
        server/api.md: reference/rest-api.md
        worker/index.md: concepts/workers.md
        worker/configuration.md: reference/worker-config.md
        worker/deployment.md: guides/deploying-workers.md
        python-sdk/index.md: reference/python-sdk.md
        python-sdk/installation.md: reference/python-sdk.md
        python-sdk/decorators.md: reference/python-sdk.md
        python-sdk/examples.md: examples/index.md

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Get started:
      - Quickstart: getting-started/quickstart.md
      - Your first task: getting-started/first-task.md
      - Installation: getting-started/installation.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Queues and priorities: concepts/queues.md
      - Workers: concepts/workers.md
  - Guides:
      - Enqueueing tasks: guides/enqueueing-tasks.md
      - Getting results: guides/result-delivery.md
      - Payload schemas: guides/payload-schemas.md
      - Task lifecycle: guides/task-lifecycle.md
      - Vaults (secrets): guides/vaults.md
      - Deploying workers: guides/deploying-workers.md
      - Running without Docker: guides/local-development.md
  - Operate:
      - GPU autoscaling: guides/autoscaling.md
      - Worker control: guides/worker-control.md
      - Monitoring: guides/monitoring.md
      - Email alerts: guides/alerting.md
      - Production deployment: operate/production.md
      - Security: operate/security.md
      - Upgrading: operate/upgrading.md
  - Reference:
      - CLI: reference/cli.md
      - REST API: reference/rest-api.md
      - Server configuration: reference/server-config.md
      - Queue configuration: reference/queue-config.md
      - Worker configuration: reference/worker-config.md
      - Python SDK: reference/python-sdk.md
  - Examples: examples/index.md
  - Troubleshooting: troubleshooting.md

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://runqy.com
      name: runqy.com
    - icon: fontawesome/brands/github
      link: https://github.com/Publikey/runqy
      name: runqy on GitHub
    - icon: fontawesome/solid/robot
      link: https://runqy.com/docs/llms.txt
      name: llms.txt

copyright: Copyright &copy; 2024-2026 Publikey
